apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: commerce
  description: Commerce business capabilities.
spec:
  owner: group:default/platform-team
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: ecommerce-platform
  description: Services that power the ecommerce experience.
spec:
  owner: group:default/platform-team
  domain: commerce
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: platform-team
  description: Owns developer-platform capabilities and payment-api.
spec:
  type: team
  profile:
    displayName: Platform Team
  members: [crilsen]
  children: []
---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: crilsen
  description: Local portfolio administrator.
spec:
  profile:
    displayName: Cristiano Nilsen
    email: crilsen@local.test
  memberOf: [platform-team]
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: checkout-team
  description: Owns checkout-facing services.
spec:
  type: team
  profile:
    displayName: Checkout Team
  children: []
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: orders-api-contract
  description: Contract for processing orders.
spec:
  type: openapi
  lifecycle: production
  owner: group:default/checkout-team
  system: ecommerce-platform
  definition: |
    openapi: 3.0.3
    info: { title: Orders API, version: 1.0.0 }
    paths:
      /orders/process:
        get:
          responses:
            '200': { description: Order processed }
